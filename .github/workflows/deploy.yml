name: Build & Deploy to VPS

# NOTE: The target VPS has been decommissioned, so this pipeline no longer
# runs automatically. It is kept for reference and can still be triggered
# manually (workflow_dispatch) if a deployment target is restored and the
# VPS_HOST / VPS_USER / VPS_SSH_KEY secrets are configured again.
on:
  workflow_dispatch:   # Only manual, on-demand runs

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/ytalharabaci/phish-and-discover

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Caches Docker layers (incl. the slow ProjectDiscovery Go tool builds)
          # in GitHub's Actions cache, so unrelated commits don't recompile them.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          CORE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,CORE_IMAGE
          script: |
            set -e

            DEPLOY_DIR="/opt/phish-and-discover"
            cd "$DEPLOY_DIR"

            echo "==> Pulling latest docker-compose.yml/Caddyfile/scripts from git..."
            git pull origin main

            echo "==> Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            echo "==> Pulling prebuilt images (no local build — VPS has no SSD)..."
            docker compose pull

            echo "==> Ensuring ./phish_data is owned by the container's non-root user..."
            mkdir -p ./phish_data
            PHISH_UID=$(docker run --rm --entrypoint id "$CORE_IMAGE" -u phish)
            PHISH_GID=$(docker run --rm --entrypoint id "$CORE_IMAGE" -g phish)
            chown -R "$PHISH_UID:$PHISH_GID" ./phish_data

            echo "==> Restarting stack..."
            docker compose up -d --remove-orphans

            echo "==> Removing dangling images..."
            docker image prune -f

            echo "==> Waiting for phish-core to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' phish_core 2>/dev/null || echo "pending")
              if [ "$STATUS" = "healthy" ]; then
                echo "==> phish-core is healthy."
                break
              fi
              echo "    attempt $i/30 — status: $STATUS"
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "ERROR: phish-core did not become healthy in time."
              docker compose logs --tail=50 phish-core
              exit 1
            fi

            echo "==> Deploy complete."
